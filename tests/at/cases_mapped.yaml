  - id: save_logic_modify_filename_format
    name: "【储存】文管窗口_修改文件名与格式"
    module: "save_logic"
    status: "active"
    annotation:
      测试界面: "截图工具栏-保存按钮 + 格式选择按钮 + 文管窗口"
      测试功能: "通过文管窗口修改文件名和通过格式按钮切换JPG格式"
      前置条件: "截图录屏可正常启动"
      AT元素引用: ["save_local_button", "shot_option_but"]
    steps:
      - step_type: "action"
        description: "ctrl+alt+a启动截图 + 拖拽框选区域"
        action: "session_start"
        command: "xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2; xdotool mousemove 320 220 mousedown 1; sleep 0.1; xdotool mousemove 920 620 mouseup 1; sleep 1.0"
      - step_type: "action"
        description: "点击保存按钮右侧下拉区打开菜单并选择每次询问"
        action: "session_start"
        command: "python3 helper.py save-menu-navigate 每次询问"
      - step_type: "action"
        description: "点击保存按钮打开文管窗口"
        action: "element_action"
        selector: {accessible_id: "save_local_button", role: "button"}
        do: "click"
        click_mode: "coordinate"
      - step_type: "action"
        description: "文管窗口ctrl+a全选文件名"
        action: "keyboard_hot_key"
        key: "ctrl+a"
      - step_type: "action"
        description: "输入文件名test1"
        action: "keyboard_type"
        text: "test1"
      - step_type: "action"
        description: "按Enter保存"
        action: "keyboard_press"
        key: "Return"
      - step_type: "action"
        description: "ctrl+alt+a启动截图 + 拖拽框选区域"
        action: "session_start"
        command: "xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2; xdotool mousemove 340 240 mousedown 1; sleep 0.1; xdotool mousemove 900 600 mouseup 1; sleep 1.0"
      - step_type: "action"
        description: "点击保存按钮右侧下拉区打开菜单并选择每次询问"
        action: "session_start"
        command: "python3 helper.py save-menu-navigate 每次询问"
