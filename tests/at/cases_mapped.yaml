  # === save_logic 模块新增用例（存储逻辑） ===

  - id: save_logic_default_path_desktop
    name: "【储存】默认路径_桌面"
    module: "save_logic"
    status: "active"
    annotation:
      测试界面: "截图工具栏-保存按钮 + 文管窗口"
      测试功能: "每次询问模式与保存时选择位置模式下文管窗口默认桌面路径保存"
      前置条件: "截图录屏可正常启动"
      AT元素引用: ["save_local_button"]
    steps:
      - step_type: "action"
        description: "ctrl+alt+a启动截图 + 拖拽框选区域"
        action: "session_start"
        command: "xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2; xdotool mousemove 320 220 mousedown 1; sleep 0.1; xdotool mousemove 920 620 mouseup 1; sleep 1.0"
      - step_type: "action"
        description: "点击保存按钮右侧下拉区打开菜单并选择每次询问"
        action: "session_start"
        command: "python3 helper.py save-menu-navigate 每次询问"
      - step_type: "action"
        description: "点击保存按钮打开文管窗口"
        action: "element_action"
        selector: {accessible_id: "save_local_button", role: "button"}
        do: "click"
        click_mode: "coordinate"
      - step_type: "action"
        description: "文管窗口按Enter保存到桌面"
        action: "keyboard_press"
        key: "Return"
      - step_type: "action"
        description: "ctrl+alt+a启动截图 + 拖拽框选区域"
        action: "session_start"
        command: "xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2; xdotool mousemove 340 240 mousedown 1; sleep 0.1; xdotool mousemove 900 600 mouseup 1; sleep 1.0"
      - step_type: "action"
        description: "点击保存按钮右侧下拉区打开菜单并选择指定位置→保存时选择位置"
        action: "session_start"
        command: "python3 helper.py save-menu-navigate 指定位置 保存时选择位置"
      - step_type: "action"
        description: "点击保存按钮打开文管窗口"
        action: "element_action"
        selector: {accessible_id: "save_local_button", role: "button"}
        do: "click"
        click_mode: "coordinate"
      - step_type: "action"
        description: "文管窗口按Enter保存到桌面"
        action: "keyboard_press"
        key: "Return"
      - step_type: "assert"
        description: "验证每次询问模式下截图文件已生成"
        action: "assert_file_exists"
        path: "~/Pictures/at-tests/default_path_ask.ok"
      - step_type: "assert"
        description: "验证保存时选择位置模式下截图文件已生成"
        action: "assert_file_exists"
        path: "~/Pictures/at-tests/default_path_choose.ok"

