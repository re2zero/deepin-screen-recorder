      python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" clear-marker save_special;
      root=$(python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" root);
      outdir="~/Pictures/at-tests/tes!@#^&文件夹222/";
      rm -rf "$outdir"; mkdir -p "$outdir";
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5'
    wait: 2.0
  - step_type: action
    action: command
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2;
      xdotool mousemove 320 220 mousedown 1; sleep 0.1; xdotool mousemove 920 620 mouseup 1; sleep 1.0'
    wait: 3.0
  - step_type: action
    action: command
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" save-menu-navigate 每次询问'
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      accessible_id: save_local_button
      role: button
    do: click
    click_mode: coordinate
    wait: 1.5
  - step_type: action
    action: file_dialog_select
    path: ~/Pictures/at-tests/tes!@#^&文件夹222/
    name: screenshot.png
    wait: 3.0
  assert_steps:
  - step_type: assert
    action: assert_file_exists
    path: ~/Pictures/at-tests/tes!@#^&文件夹222/screenshot.png

- id: save_logic_confirm_button_clipboard
  name: 【储存】√按钮_触发复制到剪贴板
  tags:
  - save
  - clipboard
  - confirm-button
  steps:
  - step_type: action
    action: command
    command: |
      bash -lc 'set -e; export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" clear-marker confirm_clipboard;
      python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" set-shot-clipboard;
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5'
    wait: 2.0
  - step_type: action
    action: command
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2;
      xdotool mousemove 330 230 mousedown 1; sleep 0.1; xdotool mousemove 900 600 mouseup 1; sleep 1.0'
    wait: 3.0
  # TODO：源码设置与close按钮一致了，需要在源码中修正后打开
  # - step_type: action
  #   action: element_action
  #   selector:
  #     accessible_id: toolbar_confirm_button
  #     role: button
  #   do: click
  #   click_mode: coordinate
  #   wait: 1.0
  - step_type: action
    action: keyboard_press
    key: Return
    wait: 3.0
  - step_type: action
    action: command
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" check-clipboard confirm_clipboard'
    wait: 3.0
  assert_steps:
  - step_type: assert
    action: assert_file_exists
    path: ~/Pictures/at-tests/confirm_clipboard.ok

teardown:
- action: command
  command: |
    bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
    python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" restore;
    xdotool key --clearmodifiers Escape >/dev/null 2>&1 || true;
    gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true'
  wait: 0.5
- action: session_stop
