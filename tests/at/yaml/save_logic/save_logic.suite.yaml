name: save_logic_suite
app: deepin-screen-recorder
description: 储存逻辑：默认路径保存、修改路径、修改文件名与格式、特殊字符路径、√按钮复制到剪贴板
module: save_logic
tags:
- at
- save
- storage
fast_fail: false
env_check: []
setup:
- action: command
  command: |
    bash -lc 'python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" init'
  wait: 0.5
suites:
- id: save_logic_default_path_desktop
  name: 【储存】默认路径_桌面
  tags:
  - save
  - default-path
  - desktop
  steps:
  - step_type: action
    action: session_start
    command: |
      bash -lc 'set -e; export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      rm -f ~/Desktop/截图_选择区域*;
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5'
    wait: 2.0
  - step_type: action
    action: command
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2;
      xdotool mousemove 320 220 mousedown 1; sleep 0.1; xdotool mousemove 920 620 mouseup 1; sleep 1.0'
    wait: 3.0
  - step_type: action
    action: command
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" save-menu-navigate 每次询问'
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      accessible_id: save_local_button
      role: button
    do: click
    click_mode: coordinate
    wait: 1.5
  - step_type: action
    action: keyboard_press
    key: Return
    wait: 3.0
  - step_type: action
    action: command
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2;
      xdotool mousemove 340 240 mousedown 1; sleep 0.1; xdotool mousemove 900 600 mouseup 1; sleep 1.0'
    wait: 3.0
  - step_type: action
    action: command
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" save-menu-navigate 指定位置 保存时选择位置'
    wait: 3.0
  - step_type: action
    action: element_action
    selector:
      accessible_id: save_local_button
      role: button
    do: click
    click_mode: coordinate
    wait: 1.5
  - step_type: action
    action: keyboard_press
    key: Return
    wait: 3.0
  assert_steps:
  - step_type: assert
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" assert-recent-file "~/Desktop/截图_选择区域*" 60'

