name: basic_capture_record_suite
app: deepin-screen-recorder
description: 截图录屏基础可用性：快捷键启动截图、框选区域、工具栏保存文件
module: basic_capture_record
tags:
- at
- basic
- screenshot
fast_fail: true
env_check: []
setup:
- action: session_start
  command: |
    bash -lc 'python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" init'
  wait: 0.5
suites:
- id: basic_hotkey_select_region_toolbar_save_button
  name: Ctrl+Alt+A 启动截图并框选后工具栏显示保存按钮
  tags:
  - screenshot
  - toolbar
  steps:
  - step_type: action
    action: session_start
    command: |
      bash -lc 'set -e; export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5'
    wait: 1.5
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2;
      xdotool mousemove 320 220 mousedown 1; sleep 0.1; xdotool mousemove 920 620 mouseup 1; sleep 1.0'
    wait: 3.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: save_local_button
      role: button
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: toolbar_close_button
      role: button
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: undo_button
      role: button
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 0.3
- id: basic_hotkey_select_region_save_file
  name: Ctrl+Alt+A 启动截图，框选区域后点击工具栏保存并生成图片
  tags:
  - screenshot
  - toolbar
  - save
  steps:
  - step_type: action
    action: session_start
    command: |
      bash -lc 'set -e; export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" clear-marker region_save;
      outdir=$(python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" clean-child out);
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" set-shot-file "$outdir" 0;
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5'
    wait: 2.0
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2;
      xdotool mousemove 320 220 mousedown 1; sleep 0.1; xdotool mousemove 920 620 mouseup 1; sleep 1.0'
    wait: 3.0
  - step_type: action
    action: element_action
    selector:
      accessible_id: save_local_button
      role: button
    do: click
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      outdir=$(python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" root)/out;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" wait-image "$outdir" .png,.jpg,.jpeg region_save any'
    wait: 35.0
  assert_steps:
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" assert-marker region_save'
    wait: 1.0
