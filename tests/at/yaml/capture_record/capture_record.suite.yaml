      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" assert-marker double_click_clipboard'
    wait: 1.0
- id: basic_record_region_save_mp4
  name: Ctrl+Alt+R 启动录屏，框选区域后按 Enter 开始录制，再按 Ctrl+Alt+R 停止并生成 MP4 文件
  tags:
  - record
  - mp4
  - save
  steps:
  - step_type: action
    action: session_start
    command: |
      bash -lc 'set -e; export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" clear-marker record_mp4;
      outdir=$(python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" clean-child record);
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" set-recorder "$outdir";
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopRecord >/dev/null 2>&1 || true;
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true; sleep 0.5'
    wait: 2.0
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+r; sleep 1.2'
    wait: 1.5
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool mousemove 360 260 mousedown 1; sleep 0.1; xdotool mousemove 660 500 mouseup 1'
    wait: 1.5
  - step_type: action
    action: keyboard_press
    key: Return
    wait: 10.0
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+r; sleep 1.2'
    wait: 1.5
  assert_steps:
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      root=$(python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" root); python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" wait-mp4 "$root/record/Screen Recordings" record_mp4'
    wait: 35.0
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" assert-marker record_mp4'
    wait: 1.0
teardown:
- action: session_start
  command: |
    bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
    python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" restore;
    xdotool key --clearmodifiers Escape >/dev/null 2>&1 || true;
    gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true'
  wait: 0.5
- action: session_stop
