      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+r; sleep 1.2;
      xdotool mousemove 360 260 mousedown 1; sleep 0.1; xdotool mousemove 660 500 mouseup 1; sleep 1.0'
    wait: 1.5
  - step_type: action
    action: element_action
    selector:
      accessible_id: record_option_but
      role: button
    do: click
    click_mode: coordinate
  - step_type: action
    action: dtk_main_menu
    items:
    - 桌面
  - step_type: action
    action: keyboard_press
    key: Return
    # deepin-screen-recorder starts recording after a countdown. Wait
    # long enough before stopping so a valid video file is produced.
    wait: 10.0
  - step_type: action
    action: command
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+r; sleep 1.2'
    wait: 1.5
  - step_type: action
    action: command
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      root=$(python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" root); start=$(cat "$root/record_savepath_start.ok"); python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" wait-video "$HOME/Desktop" .mp4 record_savepath "$start"'
    wait: 10.0
  - step_type: action
    action: command
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" assert-marker record_savepath'
    wait: 1.0

