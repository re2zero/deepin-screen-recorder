      xdotool key --clearmodifiers ctrl+alt+r; sleep 1.2'
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: record_option_but
      role: button
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      root=$(python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" root); python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" wait-mp4 "$root/record_fps/Screen Recordings" record_fps'
    wait: 40.0
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" assert-marker record_fps'
    wait: 1.0
- id: basic_record_options_toolbar_elements
  name: 录屏工具栏-全部元素显示
  tags:
  - record
  - toolbar
  - elements
  steps:
  - step_type: action
    action: session_start
    command: |
      bash -lc 'set -e; export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5'
    wait: 1.5
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+r; sleep 1.2'
    wait: 1.5
  assert_steps:
  - step_type: assert
