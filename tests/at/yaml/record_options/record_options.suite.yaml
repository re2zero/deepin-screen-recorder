    selector:
      accessible_id: microphoneAction
      role: check box
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: keyboard_button
      role: button
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: camera_button
      role: button
  - step_type: assert
