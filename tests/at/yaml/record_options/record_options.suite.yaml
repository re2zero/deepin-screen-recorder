name: basic_record_options_suite
app: deepin-screen-recorder
description: 录屏选项：格式切换（GIF/MP4/MKV）、帧数、音频、录制鼠标、保存路径
module: basic_record_options
tags:
- at
- basic
- record
- options
fast_fail: true
env_check: []
setup:
- action: session_start
  command: |
    bash -lc 'python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" init'
  wait: 0.5
suites:
- id: basic_record_options_memory_format
  name: 录屏选项-记忆功能-格式记忆
  tags:
  - record
  - options
  - format
  steps:
  - step_type: action
    action: session_start
    command: |
      bash -lc 'set -e; export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" clear-marker record_format_memory;
      outdir=$(python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" clean-child record_format);
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" set-recorder-opts format=1 frame_rate=5 save_op=0 save_dir="$outdir" audio=0 cursor=0;
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopRecord >/dev/null 2>&1 || true;
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true; sleep 0.5'
    wait: 2.0
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+r; sleep 1.2'
    wait: 1.5
  - step_type: action
    action: element_action
    selector:
      accessible_id: record_option_but
      role: button
    do: click
  - step_type: action
    action: dtk_main_menu
    items:
    - MP4
  - step_type: action
    action: keyboard_press
    key: Esc
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+r; sleep 1.2'
    wait: 1.5
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool mousemove 360 260 mousedown 1; sleep 0.1; xdotool mousemove 660 500 mouseup 1; sleep 1.0'
    wait: 3.0
  - step_type: action
    action: keyboard_press
    key: Return
    wait: 10.0
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+r; sleep 1.2'
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: record_option_but
      role: button
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      root=$(python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" root); python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" wait-mp4 "$root/record_format/Screen Recordings" record_format_memory'
    wait: 40.0
  - step_type: action
    action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/helper.py" assert-marker record_format_memory'
    wait: 1.0
