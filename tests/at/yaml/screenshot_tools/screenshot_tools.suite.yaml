name: basic_screenshot_tools_suite
app: deepin-screen-recorder
description: 截图工具栏：几何工具（矩形/圆形）、形状工具、颜色选择、撤销
module: basic_screenshot_tools
tags:
- at
- basic
- screenshot
- toolbar
fast_fail: false
env_check: []
setup:
- action: command
  command: |
    bash -lc 'python3 "${PROJECT_ROOT}/tests/at/yaml/helper.py" init'
  wait: 0.5
suites:
- id: basic_screenshot_tools_geometric
  name: 截图工具栏-几何工具按钮显示
  tags:
  - screenshot
  - toolbar
  - geometric
  steps:
  - step_type: action
    action: command
    command: |
      bash -lc 'set -e; export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5'
    wait: 1.5
  - step_type: action
    action: command
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2;
      xdotool mousemove 320 220 mousedown 1; sleep 0.1; xdotool mousemove 920 620 mouseup 1; sleep 1.0'
    wait: 3.0
  - step_type: action
    action: element_action
    selector:
      accessible_id: gio_button
      role: button
    do: click
    click_mode: coordinate
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: save_local_button
      role: button
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: gio_button
      role: button
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: rectangle_button
      role: button
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: oval_button
      role: button
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 0.3
