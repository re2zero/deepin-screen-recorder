      role: button
    do: click
    click_mode: coordinate
    wait: 2.0
  # 点击贴图区域让其focus显示工具栏
  - step_type: action
    action: mouse_click
    x: 500
    y: 500
    wait: 0.3
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: pin_save_but
      role: button
  - step_type: assert
