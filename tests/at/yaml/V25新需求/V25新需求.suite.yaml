- id: suite_V25新需求_005_s1
  name: 声音选项记忆-麦克风与系统音频
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+alt+r
  - step_type: action
    action: element_action
    selector:
      name: record_option_but
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: microphoneAction
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: sysAudioAction
      role: check box
    do: click
  - step_type: action
    action: keyboard_press
    key: Esc
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+alt+r
  - step_type: action
    action: element_action
    selector:
      name: record_option_but
      role: push button
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: microphoneAction
      role: check box
  - step_type: assert
    action: assert_element
    selector:
      name: sysAudioAction
      role: check box
  - step_type: assert
    action: assert_element
    selector:
      name: microphoneAction
      role: check box
