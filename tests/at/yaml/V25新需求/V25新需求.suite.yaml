name: V25新需求_suite
app: deepin-screen-recorder
module: V25新需求
setup:
- action: session_start
  command: deepin-screen-recorder
  wait: 3.0
suites:
- id: suite_V25新需求_001_s1
  name: AI截图-快捷键A触发
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+alt+a
  - step_type: action
    action: keyboard_press
    key: a
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ai_assistant_button
      role: push button
- id: suite_V25新需求_002_s1
  name: AI截图-首次使用提示显示与消失
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+alt+a
  - step_type: action
    action: element_action
    selector:
      name: ai_assistant_button
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: toolbar_close_button
      role: push button
    do: click
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+alt+a
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ai_assistant_button
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: ai_assistant_explain_button
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: ai_assistant_button
      role: push button
