name: AI全量_suite
app: deepin-screen-recorder
module: AI全量
setup:
- action: session_start
  command: deepin-screen-recorder
  wait: 3.0
suites:
- id: suite_AI全量_001_s1
  name: 保存优化-指定位置/剪切板/桌面保存
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+alt+a
  - step_type: action
    action: element_action
    selector:
      name: shot_option_but
      role: push button
    do: click
  - step_type: action
    action: dtk_main_menu
    items:
    - 指定位置
  - step_type: action
    action: element_action
    selector:
      name: save_local_button
      role: push button
    do: click
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+alt+a
  - step_type: action
    action: element_action
    selector:
      name: shot_option_but
      role: push button
    do: click
  - step_type: action
    action: dtk_main_menu
    items:
    - 桌面
  - step_type: action
    action: element_action
    selector:
      name: save_local_button
      role: push button
    do: click
  assert_steps:
  - step_type: assert
    action: assert_not_exists
    selector:
      name: save_local_button
      role: push button
  - step_type: assert
    action: assert_not_exists
    selector:
      name: save_local_button
      role: push button
