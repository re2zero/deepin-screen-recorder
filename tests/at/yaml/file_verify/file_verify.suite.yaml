name: file_verify_suite
app: deepin-screen-recorder
description: 文件级验证：截图格式保存（PNG/JPG/BMP）、连续保存自动命名、录屏格式（GIF/MKV/MP4）产物落盘验证
module: file_verify
tags:
- at
- file
- verify
fast_fail: true
env_check: []
setup:
- action: session_start
  command: |
    bash -lc 'python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" init'
  wait: 0.5
suites:
- id: file_verify_save_format_png
  name: 指定目录保存 PNG 格式截图
  tags:
  - screenshot
  - save
  - format
  - png
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" clear-marker format_png;
      outdir=$(python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" clean-child formats/png);
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" set-shot-file "$outdir" 0;
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5; xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2;
      xdotool mousemove 340 240 mousedown 1; sleep 0.1; xdotool mousemove 900 600 mouseup 1; sleep 1.0;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" click-at-name save_local_button;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" wait-image "$outdir" .png format_png PNG'
    wait: 35.0
  assert_steps:
  - action: session_start
    command: |
      bash -lc 'python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" assert-marker format_png'
    wait: 1.0

- id: file_verify_save_format_jpg
  name: 指定目录保存 JPG 格式截图
  tags:
  - screenshot
  - save
  - format
  - jpg
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" clear-marker format_jpg;
      outdir=$(python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" clean-child formats/jpg);
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" set-shot-file "$outdir" 1;
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5; xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2;
      xdotool mousemove 340 240 mousedown 1; sleep 0.1; xdotool mousemove 900 600 mouseup 1; sleep 1.0;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" click-at-name save_local_button;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" wait-image "$outdir" .jpg format_jpg JPEG'
    wait: 35.0
  assert_steps:
  - action: session_start
    command: |
      bash -lc 'python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" assert-marker format_jpg'
    wait: 1.0

- id: file_verify_save_format_bmp
  name: 指定目录保存 BMP 格式截图
  tags:
  - screenshot
  - save
  - format
  - bmp
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" clear-marker format_bmp;
      outdir=$(python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" clean-child formats/bmp);
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" set-shot-file "$outdir" 2;
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5; xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2;
      xdotool mousemove 340 240 mousedown 1; sleep 0.1; xdotool mousemove 900 600 mouseup 1; sleep 1.0;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" click-at-name save_local_button;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml/file_verify/file_verify_helper.py" wait-image "$outdir" .bmp format_bmp BMP'
    wait: 35.0
  assert_steps:
