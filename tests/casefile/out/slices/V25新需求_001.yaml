- id: '1949941'
  raw_title: AI截图功能-首次使用新功能提示显示与消失验证
  raw_precondition: 1.从未点击过任何截图工具栏中的AI图标（首次使用场景）
  raw_steps: '1. 使用软件默认截图快捷键或点击应用，唤醒截图工具

    2. 查看截图工具栏区域是否显示提示文案“截图已支持 AI 能力，点击体验”

    3. 点击截图工具栏中的AI图标

    4. 点击截图工具右上角的关闭按钮，关闭当前截图工具

    5. 再次使用软件默认截图快捷键或点击应用，唤醒截图工具

    6. 查看截图工具栏区域是否还显示提示文案“截图已支持 AI 能力，点击体验”'
  raw_expected: "1. \n2. 截图工具栏区域显示提示文案“截图已支持 AI 能力，点击体验”\n3. \n4. \n5. \n6. 截图工具栏区域未显示提示文案“截图已支持\
    \ AI 能力，点击体验”"
  title: AI截图功能-首次使用新功能提示显示与消失验证
  module: V25新需求
  priority: '2'
  precondition:
  - 从未点击过任何截图工具栏中的AI图标（首次使用场景）
  steps:
  - 使用软件默认截图快捷键或点击应用，唤醒截图工具
  - 查看截图工具栏区域是否显示提示文案“截图已支持 AI 能力，点击体验”
  - 点击截图工具栏中的AI图标
  - 点击截图工具右上角的关闭按钮，关闭当前截图工具
  - 再次使用软件默认截图快捷键或点击应用，唤醒截图工具
  - 查看截图工具栏区域是否还显示提示文案“截图已支持 AI 能力，点击体验”
  expected:
  - ''
  - 截图工具栏区域显示提示文案“截图已支持 AI 能力，点击体验”
  - ''
  - ''
  - ''
  - 截图工具栏区域未显示提示文案“截图已支持 AI 能力，点击体验”
  case_type: 功能测试
  manual: false

- id: '1949939'
  raw_title: AI截图功能-AI截图选择解释/总结/翻译后，OCR识别中显示验证
  raw_precondition: 1.  唤起截图录屏
  raw_steps: '1. 使用鼠标框选包含准备好的中文文字的区域，释放鼠标完成截图

    2. 点击AI工具栏中的「解释」/「总结」/「翻译」按钮

    3. 打开系统剪贴板查看工具

    4. 检查AI随航功能界面OCR处理中的显示内容'
  raw_expected: '1. 屏幕显示截图编辑区域，底部弹出包含「解释」「总结」「翻译」的AI工具栏

    2. AI工具栏消失，截图编辑窗口关闭（退出截图状态）

    3. 剪贴板中存在本次截图的图像数据

    4. AI随航界面显示OCR识别中，随航面板的原文区域和生成区域均为加载中，且顶部的功能切换按钮不显示、下方的功能按钮和继续对话均不显示'
  title: AI截图功能-AI截图选择解释/总结/翻译后，OCR识别中显示验证
  module: V25新需求
  priority: '2'
  precondition:
  - 唤起截图录屏
  steps:
  - 使用鼠标框选包含准备好的中文文字的区域，释放鼠标完成截图
  - 点击AI工具栏中的「解释」/「总结」/「翻译」按钮
  - 打开系统剪贴板查看工具
  - 检查AI随航功能界面OCR处理中的显示内容
  expected:
  - 屏幕显示截图编辑区域，底部弹出包含「解释」「总结」「翻译」的AI工具栏
  - AI工具栏消失，截图编辑窗口关闭（退出截图状态）
  - 剪贴板中存在本次截图的图像数据
  - AI随航界面显示OCR识别中，随航面板的原文区域和生成区域均为加载中，且顶部的功能切换按钮不显示、下方的功能按钮和继续对话均不显示
  case_type: 功能测试
  manual: false

